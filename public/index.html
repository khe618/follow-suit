<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b1a14">
  <title>Follow Suit</title>
  <meta name="description" content="Follow Suit: a multiplayer card auction. Bid on whether the next card follows suit.">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Follow Suit</a>
    <span id="connPill" class="pill warn" hidden>reconnecting</span>
    <div class="topbar-actions">
      <button type="button" id="sfxBtn" class="icon-btn" aria-label="Sound effects on" aria-pressed="true">🔊</button>
      <button type="button" id="helpBtn" class="icon-btn labeled">How to play</button>
      <button type="button" id="leaveBtn" class="icon-btn" aria-label="Leave table" hidden>⇠</button>
    </div>
  </header>

  <main id="app">
    <section id="landingView" class="view landing" hidden>
      <h1 class="wordmark">
        <span class="wm-text">Follow Suit</span>
        <span class="wm-suits" aria-hidden="true"><span class="glyph spades">♠</span><span class="glyph hearts">♥</span><span class="glyph diamonds">♦</span><span class="glyph clubs">♣</span></span>
      </h1>
      <form id="landingForm" class="stack">
        <label for="nameInput">Your name</label>
        <input id="nameInput" maxlength="16" autocomplete="nickname">
        <button type="button" id="quickBtn" class="chip-btn primary">Quick play</button>
        <button type="button" id="friendsBtn" class="chip-btn">Play with friends</button>
      </form>
    </section>

    <section id="joinView" class="view join" hidden>
      <div id="joinBackdrop" class="join-backdrop" aria-hidden="true"></div>
      <form id="joinForm" class="join-card">
        <label for="joinNameInput">Your name</label>
        <input id="joinNameInput" maxlength="16" autocomplete="nickname">
        <button type="submit" id="sitBtn" class="chip-btn primary">Sit down</button>
        <div id="inPlayPip" class="in-play" hidden role="status" aria-label="Table in play"></div>
      </form>
    </section>

    <section id="tableView" class="view table-view" hidden>
      <div id="log" class="log" hidden>
        <div class="log-scroll">
          <table class="log-table" aria-label="Cards and bids so far">
            <thead><tr id="logHead"></tr></thead>
            <tbody id="logBody"></tbody>
          </table>
        </div>
        <div id="suitCounts" class="suit-counts"></div>
      </div>
      <div id="table" class="table">
        <div id="seats" class="seats"></div>
        <div id="centre" class="centre">
          <div id="deck" class="deck" aria-label="Deck"><span id="deckCount" class="deck-count"></span></div>
          <div id="refSlot" class="ref-slot"></div>
          <div id="priceBadge" class="price-badge" hidden></div>
          <div id="lobbyCentre" class="lobby-centre" hidden>
            <button type="button" id="dealBtn" class="chip-btn primary">Deal</button>
            <button type="button" id="inviteBtn" class="chip-btn" aria-label="Copy invite link">Invite</button>
          </div>
        </div>
        <div id="sprites" class="sprite-layer" aria-hidden="true"></div>
      </div>
      <div id="hand" class="hand">
        <div id="handFan" class="hand-fan" aria-hidden="true"></div>
        <div id="handMemo" class="hand-memo" aria-label="Your hand" hidden></div>
      </div>
      <div id="dock" class="dock" hidden>
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="ring-track" cx="50" cy="50" r="45"/><circle id="ringArc" class="ring-arc" cx="50" cy="50" r="45"/></svg>
          <input id="bidInput" type="number" min="0" max="100" step="1" value="0" inputmode="numeric" aria-label="Your bid">
        </div>
        <input id="bidRange" type="range" min="0" max="100" step="1" value="0" aria-label="Your bid">
        <button type="button" id="lockBtn" class="chip-btn primary">Bid</button>
      </div>
    </section>

    <section id="resultsView" class="overlay" hidden>
      <div class="overlay-card">
        <ol id="standings" class="standings"></ol>
        <div class="row">
          <button type="button" id="playAgainBtn" class="chip-btn primary">Play again</button>
          <button type="button" id="leaveResultsBtn" class="chip-btn">Leave</button>
        </div>
        <details class="history-details">
          <summary>History</summary>
          <div class="table-wrap">
            <table class="history">
              <thead><tr><th>#</th><th>Ref</th><th>Bids</th><th>Buyer @ price</th><th>Flip</th><th>Score change</th></tr></thead>
              <tbody id="historyBody"></tbody>
            </table>
          </div>
        </details>
      </div>
    </section>

    <section id="takenOverView" class="view centered" hidden>
      <h2>Seat opened elsewhere</h2>
      <p>This seat is now active in another tab or device. Reload here to take it back.</p>
      <button type="button" id="reloadBtn" class="chip-btn primary">Reload</button>
    </section>

    <div id="splash" class="splash" hidden aria-hidden="true"><div class="splash-deck"><div></div><div></div><div></div></div><span id="splashCode" class="pill mono"></span></div>
    <div id="live" class="visually-hidden" aria-live="polite"></div>
    <div id="toast" class="toast" hidden></div>
  </main>

  <dialog id="tutorial" class="tutorial"></dialog>

  <script src="/game-core.js"></script>
  <script src="/seat-layout.js"></script>
  <script src="/transitions.js"></script>
  <script src="/sequencer.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
